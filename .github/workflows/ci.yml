name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · lint, unit, e2e, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ghepgo
          POSTGRES_PASSWORD: ghepgo
          POSTGRES_DB: ghepgo
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U ghepgo" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://ghepgo:ghepgo@localhost:5434/ghepgo?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret
      NODE_ENV: test
      OTP_REQUIRED: "true"
      SMS_PROVIDER: console
      GEO_PROVIDER: osm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api exec prisma generate
      - run: pnpm --filter api exec prisma migrate deploy
      - run: pnpm --filter api lint
      - run: pnpm --filter api test
      - run: pnpm --filter api build
      - run: pnpm --filter api test:e2e

  web:
    name: Web · lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: |
          pnpm --filter web exec eslint src --max-warnings=0 --rule "@typescript-eslint/no-explicit-any: off"
      - run: pnpm --filter web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_URL: http://localhost:3001/api

  mobile:
    name: Mobile · typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter mobile exec tsc --noEmit

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f apps/api/Dockerfile -t ghepgo-api:ci .
      - run: docker build -f apps/web/Dockerfile -t ghepgo-web:ci .
